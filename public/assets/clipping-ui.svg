      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
