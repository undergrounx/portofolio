      <stop offset="0%" stop-color="#14161d" />
      <stop offset="50%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
